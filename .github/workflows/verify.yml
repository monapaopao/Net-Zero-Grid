name: Verify v20

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build offline deliverables
        run: npm run build
      - name: Core regressions
        run: npm test
      - name: Inspect offline packaging
        run: npm run check:offline
